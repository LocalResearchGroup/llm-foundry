variables:
  data_local: datasets/tmp # datasets/c4_small
  data_remote: hf://datasets/LocalResearchGroup/split-avelina-python-edu/tokenized/avelinapythonedu/full/ # If blank, files must be present in data_local
  tokenizer_name: HuggingFaceTB/SmolLM2-135M
  global_seed: 42
  max_seq_len: 1024 
  run_name: custom_smollm2_135m_peft_training
  device_microbatch_size: 2
  global_train_batch_size: 8

max_seq_len: ${variables.max_seq_len}
run_name: ${variables.run_name}

model:
  name: custom-smollm2-135m
  pretrained_model_name_or_path: HuggingFaceTB/SmolLM2-135M
  model_type: smollm2-135m
  pretrained: true
  peft_config:
    peft_type: LORA
    task_type: CAUSAL_LM
    r: 1
    lora_alpha: 2
    lora_dropout: 0.0
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
    use_rslora: false
    use_dora: false

tokenizer:
  name: ${variables.tokenizer_name}
  kwargs:
    model_max_length: ${variables.max_seq_len}
  
loggers:
  wandb:
    project: 'sequence-packing'
    entity: 'local-research-group'
    name: 'avelina-python-edu-lora-sequence-packing-100ba-max-seq-len-1024'

train_loader:
  name: text
  dataset:
    local: ${variables.data_local}
    remote: ${variables.data_remote}
    split: train
    shuffle: true
    max_seq_len: ${variables.max_seq_len}
    shuffle_seed: ${variables.global_seed}
    deorder_only_format: true
    eos_token_id: 0
    # Sequence packing configuration
    sequence_packing: true
    micro_batch_size: ${variables.device_microbatch_size}  # Should match device_train_microbatch_size
    packing_buffer_size: 512  # 5 * device_batch_size
    packing_prefetch_factor: 512
    # Optional: batch size warmup
    # batch_size_warmup_min_size: 2
    # batch_size_warmup_tokens: 1000ba
  drop_last: true
  num_workers: 4

eval_loader:
  name: text
  dataset:
    local: ${variables.data_local}
    remote: ${variables.data_remote}
    split: test
    shuffle: false
    max_seq_len: ${variables.max_seq_len}
    shuffle_seed: ${variables.global_seed}
    deorder_only_format: true
    eos_token_id: 0
    # Sequence packing configuration
    sequence_packing: true
    micro_batch_size: ${variables.device_microbatch_size}  # Should match device_train_microbatch_size
    packing_buffer_size: 512  # 5 * device_batch_size
    packing_prefetch_factor: 512
    # Optional: batch size warmup
    # batch_size_warmup_min_size: 2
    # batch_size_warmup_tokens: 1000ba
  drop_last: false
  num_workers: 4

scheduler:
  name: cosine_with_warmup
  t_warmup: 100ba # 8192tok 
  alpha_f: 0.1

optimizer:
  name: decoupled_adamw
  lr: 6.0e-4
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  weight_decay: 0.0

algorithms:
  gradient_clipping:
    clipping_type: norm
    clipping_threshold: 1.0

max_duration: 1ba # 16384tok 
eval_interval: 1ba # 16384tok 
eval_first: false
eval_subset_num_batches: 10
save_overwrite: true
save_interval: 0ba  # Disable checkpointing

seed: ${variables.global_seed}
device_eval_batch_size: 4
device_train_microbatch_size: ${variables.device_microbatch_size}
global_train_batch_size: ${variables.global_train_batch_size}
precision: amp_bf16

fsdp_config:
  sharding_strategy: FULL_SHARD
  mixed_precision: PURE
  activation_checkpointing: false  # Disable for PEFT compatibility
  activation_checkpointing_reentrant: false
  activation_cpu_offload: false
  limit_all_gathers: true
  # use_orig_params: true  # Required for PEFT + FSDP

# Torch compile configuration
# compile_config:
#   dynamic: true  # Enable dynamic shapes
#   options:
#     epilogue_fusion: true  # Fuses pointwise ops into templates (requires max-autotune)
#     max_autotune: true  # Enables automatic tuning of fusion patterns
#     coordinate_descent_tuning: true  # Enables coordinate descent tuning for optimization

progress_bar: true
log_to_console: true
console_log_interval: 1ba

callbacks:
  speed_monitor:
    window_size: 10
  lr_monitor: {}
  memory_monitor: {}
  runtime_estimator: {}
  # batch_inspection:
  #   log_frequency: 1
  #   sample_size: 1
  #   log_to_console: true
  #   log_to_wandb: false
  packing_efficiency:
    log_interval: 1
